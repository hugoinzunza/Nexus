<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/static/icons/nexux-favicon-v5.ico" type="image/x-icon">
  <meta name="theme-color" content="#f4f5f8">
  <script>(function(){try{var t=localStorage.getItem('nexux-theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
  <title>NexUX · Trading</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NexUX">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/nexux-shell.css">
  <script src="/static/pwa.js" defer></script>
  <!-- TradingView Lightweight Charts (Apache-2.0), bundleada localmente. -->
  <script src="/static/vendor/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="back" href="/">← Nex<span style="color:#0aa6bd">UX</span></a>
    <h1>Co-piloto de Trading</h1>
    <a class="nav-pill" href="/m/journal/">Diario</a>
    <a class="back bt-link" href="/m/trading/backtest">Backtest SMC →</a>
    <button class="alert-btn" id="alert-btn" type="button">Alertas SMC</button>
    <button class="back bt-link" id="theme-toggle" type="button" title="Tema claro/oscuro" aria-label="Cambiar tema">Oscuro</button>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">conectando…</span>
    </div>
  </header>

  <div class="crypto-bar">
    <label for="crypto-select">Cripto</label>
    <select id="crypto-select" aria-label="Elegir criptomoneda"></select>
  </div>

  <div id="event-bar" class="event-bar" hidden></div>

  <main id="instruments" class="instruments">
    <!-- Solo se muestra la tarjeta del instrumento elegido en el selector -->
  </main>

  <footer class="foot">
    <span class="foot-note">Solo lectura · no ejecuta órdenes · capas SMC = contexto ·
      gráficos con <a class="credit" href="https://www.tradingview.com/" rel="noopener">Lightweight Charts™ de TradingView</a></span>
    <span id="last-update">—</span>
  </footer>

  <!-- Plantilla de tarjeta de instrumento (se clona por cada par) -->
  <template id="card-tpl">
    <section class="instrument-card">
      <div class="ic-header">
        <div class="ic-title">
          <h2 class="ic-symbol"></h2>
          <span class="ic-change"></span>
        </div>
        <div class="ic-price"></div>
      </div>

      <div class="risk-banner" hidden></div>

      <div class="ic-stats">
        <div class="stat"><span class="k">Máx 24h</span><span class="v ic-high"></span></div>
        <div class="stat"><span class="k">Mín 24h</span><span class="v ic-low"></span></div>
        <div class="stat"><span class="k">Vol 24h</span><span class="v ic-vol"></span></div>
      </div>

      <div class="ic-body">
        <div class="chart-wrap">
          <div class="chart-controls">
            <div class="tf-selector" role="group" aria-label="Temporalidad del gráfico"></div>
            <div class="ind-toggles" role="group" aria-label="Indicadores"></div>
            <div class="lux-toggles" role="group" aria-label="Capas SMC+"></div>
            <button class="chart-expand" type="button" aria-label="Expandir gráfico" title="Expandir">⤢</button>
            <span class="candle-timer" title="Cierre de la vela actual"><span class="ct-ic">⧗</span><span class="ct-val">—</span></span>
          </div>
          <div class="chart"></div>
        </div>
      </div>

      <!-- Plan vigente destacado: entrada / stop / objetivo a la vista -->
      <div class="plan-card" data-info="plan" hidden>
        <div class="plan-main">
          <span class="plan-dir">—</span>
          <span class="plan-rr">R:R —</span>
          <span class="plan-state">—</span>
        </div>
        <div class="plan-levels">
          <div class="pl"><span class="pl-k">Entrada</span><span class="pl-v plan-entry">—</span></div>
          <div class="pl"><span class="pl-k">Stop</span><span class="pl-v plan-sl">—</span></div>
          <div class="pl"><span class="pl-k">Objetivo</span><span class="pl-v plan-tp">—</span></div>
          <div class="pl"><span class="pl-k">Distancia a entrada</span><span class="pl-v plan-dist">—</span></div>
        </div>
        <div class="plan-note plan-cdc"></div>
      </div>

      <!-- Análisis SMC en vivo (reemplaza al libro: más útil para planear) -->
      <div class="signals smc-stats">
        <div class="sig" data-info="regimen"><span class="k">Régimen (VIX + ADX)</span><span class="v smc-regime">—</span></div>
        <div class="sig" data-info="sesgo"><span class="k">Sesgo (premium/descuento)</span><span class="v smc-bias">—</span></div>
        <div class="sig" data-info="estructura"><span class="k">Estructura (dealing range)</span><span class="v smc-struct">—</span></div>
        <div class="sig" data-info="sesion"><span class="k">Sesión activa</span><span class="v smc-session">—</span></div>
        <div class="sig" data-info="poi"><span class="k">POI más cercano</span><span class="v smc-poi-near">—</span></div>
      </div>

      <div class="smc-panel">
        <div class="smc-head">
          <span class="smc-title">POIs activos · SMC multi-TF</span>
          <span class="smc-legend">
            <i class="lg discount"></i> descuento
            <i class="lg premium"></i> premium
          </span>
        </div>
        <div class="smc-list">Analizando…</div>
      </div>
    </section>
  </template>

  <!-- Hoja de explicación de indicadores (se abre al tocar un indicador) -->
  <div class="info-modal" id="info-modal" hidden>
    <div class="info-backdrop" data-close></div>
    <div class="info-sheet" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <div class="info-head">
        <h3 class="info-title" id="info-title">—</h3>
        <button class="info-x" type="button" data-close aria-label="Cerrar">✕</button>
      </div>
      <div class="info-body"></div>
    </div>
  </div>

  <!-- Series y cálculos canónicos, compartidos con Command Center. -->
  <script type="module" src="/static/nexux-chart-series.js?v=20260822-series-v1"></script>
  <script src="app.js"></script>
  <script src="/static/theme.js"></script>
  <script src="/static/nexux-shell.js?v=7"></script>
</body>
</html>
