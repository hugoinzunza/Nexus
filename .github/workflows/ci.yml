name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 = el Python del VPS (motor); 3.12 = referencia estable (Railway).
        # Probar en 3.14 habría cazado el incidente de SQLAlchemy 2.0.36.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install pytest
      - name: Smoke tests (import de la app + bóveda)
        run: python -m pytest -q tests/
      - name: Evidencia Acciones Chile
        run: |
          python -m pytest -q tests/test_acciones_chile.py --junitxml=acciones-chile-junit.xml
          python scripts/report_acciones_chile_import_graph.py > acciones-chile-import-graph.json
      - name: Publicar evidencia Acciones Chile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acciones-chile-evidence-py${{ matrix.python }}-${{ github.sha }}
          path: |
            acciones-chile-junit.xml
            acciones-chile-import-graph.json
